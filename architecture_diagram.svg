<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a365d" />
      <stop offset="100%" stop-color="#2b6cb0" />
    </linearGradient>
    <linearGradient id="gradCnn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ebf8ff" />
      <stop offset="100%" stop-color="#bee3f8" />
    </linearGradient>
    <linearGradient id="gradLstm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#e9d8fd" />
    </linearGradient>
    <linearGradient id="gradTrans" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fff4" />
      <stop offset="100%" stop-color="#c6f6d5" />
    </linearGradient>
    <linearGradient id="gradOut" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffaf0" />
      <stop offset="100%" stop-color="#feebc8" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="25" width="1120" height="50" rx="8" fill="url(#gradHeader)" />
  <text x="600" y="56" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">
    Multi-Scale CNN-BiLSTM-Transformer Architecture (HybridBCINet)
  </text>

  <!-- Step 1: Input Tensor -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="220" height="120" rx="6" fill="#edf2f7" stroke="#cbd5e0" stroke-width="2" />
    <text x="110" y="30" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">Input Multi-Channel EEG</text>
    <text x="110" y="55" font-size="12" fill="#4a5568" text-anchor="middle">19 Standard 10-20 Channels</text>
    <text x="110" y="75" font-size="12" fill="#4a5568" text-anchor="middle">2.0s Windows @ 160 Hz</text>
    <rect x="25" y="88" width="170" height="22" rx="4" fill="#cbd5e0" />
    <text x="110" y="103" font-size="11" font-weight="bold" fill="#1a202c" text-anchor="middle">Tensor: (B, 19, 27)</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="280" y1="170" x2="330" y2="170" stroke="#2d3748" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Step 2: Multi-Scale Residual CNN -->
  <g transform="translate(340, 100)">
    <rect x="0" y="0" width="260" height="250" rx="8" fill="url(#gradCnn)" stroke="#3182ce" stroke-width="2" />
    <text x="130" y="28" font-size="15" font-weight="bold" fill="#2b6cb0" text-anchor="middle">1. Multi-Scale Residual CNN</text>
    
    <!-- Block 1 -->
    <rect x="15" y="45" width="230" height="52" rx="4" fill="#ffffff" stroke="#90cdf4" stroke-width="1.5" />
    <text x="125" y="65" font-size="12" font-weight="bold" fill="#2d3748" text-anchor="middle">Residual Block 1 (19 → 64)</text>
    <text x="125" y="85" font-size="10" fill="#4a5568" text-anchor="middle">Conv1D(k=3,p=1) + BN + GELU + Drop(0.3)</text>

    <!-- Block 2 -->
    <rect x="15" y="108" width="230" height="52" rx="4" fill="#ffffff" stroke="#90cdf4" stroke-width="1.5" />
    <text x="125" y="128" font-size="12" font-weight="bold" fill="#2d3748" text-anchor="middle">Residual Block 2 (64 → 128)</text>
    <text x="125" y="148" font-size="10" fill="#4a5568" text-anchor="middle">Conv1D(k=3,p=1) + BN + GELU + Drop(0.3)</text>

    <!-- Block 3 -->
    <rect x="15" y="171" width="230" height="52" rx="4" fill="#ffffff" stroke="#90cdf4" stroke-width="1.5" />
    <text x="125" y="191" font-size="12" font-weight="bold" fill="#2d3748" text-anchor="middle">Residual Block 3 (128 → 128)</text>
    <text x="125" y="211" font-size="10" fill="#4a5568" text-anchor="middle">Conv1D(k=3,p=1) + BN + GELU + Drop(0.3)</text>
    
    <text x="130" y="240" font-size="11" font-weight="bold" fill="#2b6cb0" text-anchor="middle">Spatial-Frequency Receptive Field</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="600" y1="225" x2="650" y2="225" stroke="#2d3748" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Step 3: BiLSTM -->
  <g transform="translate(660, 110)">
    <rect x="0" y="0" width="240" height="230" rx="8" fill="url(#gradLstm)" stroke="#805ad5" stroke-width="2" />
    <text x="120" y="28" font-size="15" font-weight="bold" fill="#6b46c1" text-anchor="middle">2. Bidirectional LSTM</text>
    
    <rect x="15" y="45" width="210" height="60" rx="4" fill="#ffffff" stroke="#d6bcfa" stroke-width="1.5" />
    <text x="120" y="68" font-size="12" font-weight="bold" fill="#2d3748" text-anchor="middle">Layer 1: BiLSTM (128 hidden)</text>
    <text x="120" y="88" font-size="10" fill="#4a5568" text-anchor="middle">Forward + Backward Context</text>

    <rect x="15" y="118" width="210" height="60" rx="4" fill="#ffffff" stroke="#d6bcfa" stroke-width="1.5" />
    <text x="120" y="141" font-size="12" font-weight="bold" fill="#2d3748" text-anchor="middle">Layer 2: BiLSTM (128 hidden)</text>
    <text x="120" y="161" font-size="10" fill="#4a5568" text-anchor="middle">Concatenated Output: 256 dim</text>

    <rect x="15" y="190" width="210" height="25" rx="4" fill="#e9d8fd" />
    <text x="120" y="206" font-size="11" font-weight="bold" fill="#553c9a" text-anchor="middle">Dropout = 0.30</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="900" y1="225" x2="950" y2="225" stroke="#2d3748" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Step 4: Transformer Encoder -->
  <g transform="translate(960, 100)">
    <rect x="0" y="0" width="180" height="250" rx="8" fill="url(#gradTrans)" stroke="#38a169" stroke-width="2" />
    <text x="90" y="28" font-size="15" font-weight="bold" fill="#276749" text-anchor="middle">3. Transformer</text>
    
    <rect x="12" y="45" width="156" height="42" rx="4" fill="#ffffff" stroke="#9ae6b4" stroke-width="1.5" />
    <text x="90" y="65" font-size="11" font-weight="bold" fill="#2d3748" text-anchor="middle">Multi-Head Attn</text>
    <text x="90" y="80" font-size="9" fill="#4a5568" text-anchor="middle">8 Attention Heads</text>

    <rect x="12" y="96" width="156" height="42" rx="4" fill="#ffffff" stroke="#9ae6b4" stroke-width="1.5" />
    <text x="90" y="116" font-size="11" font-weight="bold" fill="#2d3748" text-anchor="middle">Feed-Forward</text>
    <text x="90" y="131" font-size="9" fill="#4a5568" text-anchor="middle">d_model=256, d_ff=512</text>

    <rect x="12" y="147" width="156" height="42" rx="4" fill="#ffffff" stroke="#9ae6b4" stroke-width="1.5" />
    <text x="90" y="167" font-size="11" font-weight="bold" fill="#2d3748" text-anchor="middle">Layer Normalization</text>
    <text x="90" y="182" font-size="9" fill="#4a5568" text-anchor="middle">2 Stacked Layers</text>

    <rect x="12" y="200" width="156" height="35" rx="4" fill="#c6f6d5" />
    <text x="90" y="215" font-size="10" font-weight="bold" fill="#22543d" text-anchor="middle">Global Avg Pooling</text>
    <text x="90" y="228" font-size="9" fill="#22543d" text-anchor="middle">Vector: R^{256}</text>
  </g>

  <!-- Output Paths Downwards -->
  <path d="M 1050 350 L 1050 420 L 350 420 L 350 470" fill="none" stroke="#2d3748" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M 1050 420 L 850 420 L 850 470" fill="none" stroke="#2d3748" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Step 5A: Multi-Class Output Head -->
  <g transform="translate(180, 480)">
    <rect x="0" y="0" width="340" height="220" rx="8" fill="url(#gradOut)" stroke="#dd6b20" stroke-width="2" />
    <text x="170" y="30" font-size="15" font-weight="bold" fill="#c05621" text-anchor="middle">4A. Multi-Class Task-Condition Head</text>
    
    <rect x="20" y="48" width="300" height="45" rx="4" fill="#ffffff" stroke="#fbd38d" stroke-width="1.5" />
    <text x="170" y="68" font-size="12" font-weight="bold" fill="#2d3748" text-anchor="middle">Dense Layer: Linear(256 → 5) + Softmax</text>
    <text x="170" y="85" font-size="9" fill="#718096" text-anchor="middle">5 Task Classes (Proxies: Calm, Focused, Stressed, Fatigued, Excited)</text>

    <rect x="20" y="105" width="300" height="95" rx="4" fill="#feebc8" />
    <text x="170" y="125" font-size="11" font-weight="bold" fill="#7b341e" text-anchor="middle">LOSO Benchmark (PhysioNet EEGBCI, N=735)</text>
    <text x="170" y="145" font-size="11" font-weight="bold" fill="#22543d" text-anchor="middle">HybridBCINet: 24.89% ± 9.35% | Macro F1: 17.54%</text>
    <text x="170" y="165" font-size="10" fill="#2d3748" text-anchor="middle">RBF SVM Baseline: 39.84% ± 9.80% | F1: 37.51%</text>
    <text x="170" y="185" font-size="10" fill="#4a5568" text-anchor="middle">Chance Level: 20.00% | Latency: 12–14 ms</text>
  </g>

  <!-- Step 5B: Continuous Regression Heads -->
  <g transform="translate(680, 480)">
    <rect x="0" y="0" width="340" height="220" rx="8" fill="url(#gradOut)" stroke="#dd6b20" stroke-width="2" />
    <text x="170" y="30" font-size="15" font-weight="bold" fill="#c05621" text-anchor="middle">4B. Continuous Cognitive Telemetry Heads</text>
    
    <rect x="20" y="48" width="300" height="45" rx="4" fill="#ffffff" stroke="#fbd38d" stroke-width="1.5" />
    <text x="170" y="68" font-size="12" font-weight="bold" fill="#2d3748" text-anchor="middle">7x Parallel Heads: Linear(256 → 1) + Sigmoid</text>
    <text x="170" y="85" font-size="10" fill="#718096" text-anchor="middle">Continuous Scaled Outputs in [0.0, 1.0]</text>

    <g transform="translate(30, 105)">
      <rect x="0" y="0" width="85" height="24" rx="4" fill="#ffffff" stroke="#cbd5e0" />
      <text x="42" y="16" font-size="10" font-weight="bold" fill="#2b6cb0" text-anchor="middle">Focus</text>
      
      <rect x="95" y="0" width="85" height="24" rx="4" fill="#ffffff" stroke="#cbd5e0" />
      <text x="137" y="16" font-size="10" font-weight="bold" fill="#2b6cb0" text-anchor="middle">Attention</text>

      <rect x="190" y="0" width="85" height="24" rx="4" fill="#ffffff" stroke="#cbd5e0" />
      <text x="232" y="16" font-size="10" font-weight="bold" fill="#c53030" text-anchor="middle">Stress</text>

      <rect x="0" y="32" width="85" height="24" rx="4" fill="#ffffff" stroke="#cbd5e0" />
      <text x="42" y="48" font-size="10" font-weight="bold" fill="#c53030" text-anchor="middle">Fatigue</text>

      <rect x="95" y="32" width="85" height="24" rx="4" fill="#ffffff" stroke="#cbd5e0" />
      <text x="137" y="48" font-size="10" font-weight="bold" fill="#6b46c1" text-anchor="middle">Cognitive Load</text>

      <rect x="190" y="32" width="85" height="24" rx="4" fill="#ffffff" stroke="#cbd5e0" />
      <text x="232" y="48" font-size="10" font-weight="bold" fill="#2f855a" text-anchor="middle">Valence</text>

      <rect x="95" y="64" width="85" height="24" rx="4" fill="#ffffff" stroke="#cbd5e0" />
      <text x="137" y="80" font-size="10" font-weight="bold" fill="#2f855a" text-anchor="middle">Arousal</text>
    </g>
  </g>

  <!-- Footer Caption -->
  <text x="600" y="750" font-size="12" font-style="italic" fill="#718096" text-anchor="middle">
    Fig. 1. Detailed architectural diagram of HybridBCINet multi-scale CNN-BiLSTM-Transformer network with multi-task prediction heads.
  </text>
</svg>
